name: Test

# BlueShip had no test gate. Its only workflow builds and greps for
# agent-specific names, so twenty-odd packages covering prompt assembly, the
# dialogue window, the session store and every provider ran nowhere at all. This
# is the repository the bugs users report live in, and nothing checked it.
#
# It was worse than absent: agent-isolation had failed on every commit for long
# enough that red carried no information, so even its build verdict was buried.
# That gate is green again — its own test data named a real agent — so a red
# there now means what it says. This workflow stays separate anyway: one status,
# one meaning.

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref: a new push cancels the previous, still-queued run. The
# consequence has already bitten this project — two pushes in quick succession
# leave the first commit unverified, and a red commit can ride into main under a
# green one. The pair is tested together by the second run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub-hosted, NOT self-hosted, and that is deliberate after getting it
    # wrong: this repository has zero self-hosted runners and the account is not
    # an organisation, so there are no org-level ones either. A `runs-on:
    # self-hosted` job here queues forever — a gate that looks present and never
    # runs, which is the exact failure this workflow was written to end. The one
    # self-hosted runner belongs to the arlene repository and is already the
    # bottleneck for its Test, Deploy and Memory Lab.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real Postgres, because the tests that matter most here are the ones a
    # mock cannot see: a boundary INSERT that was dead in production for months
    # passed a fully-mocked suite, and the dialogue-window boundary lives in a
    # JOIN. No pgvector needed — nothing in this repo's tests uses vectors.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: blueship
          POSTGRES_DB: blueship_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # The DB-backed tests skip without this, and skipping is how they came to
      # be broken: internal/migrate's notification-journal test had never run
      # once, and failed the first time a database was pointed at it because its
      # fixture lacked columns the write path inserts into. What it covers is the
      # boundary INSERT that stayed dead in production — it would have caught
      # that on the first push.
      BLUESHIP_TEST_POSTGRES_DSN: postgres://postgres:blueship@localhost:5432/blueship_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Test
        run: go test ./... -timeout 15m

      # A skip is not a pass. If the DSN stops resolving — a renamed service, a
      # changed port — every database test goes quietly green again, which is the
      # failure mode this workflow exists to end. So the run asserts they
      # actually executed.
      - name: Assert the database tests ran
        run: |
          out=$(go test ./internal/migrate/ ./runtime/session/ \
                  -run 'Postgres|DialogWindow|LatestSoftSummary|LatestDialogRole' -count=1 -v 2>&1)
          if grep -q 'SKIP' <<<"$out"; then
            grep -B2 'SKIP' <<<"$out" >&2
            echo "ERROR: database tests skipped — BLUESHIP_TEST_POSTGRES_DSN did not resolve." >&2
            echo "       They pass by not running, which is what this check exists to catch." >&2
            exit 1
          fi
          grep -cE '^(=== RUN|--- PASS)' <<<"$out" | xargs echo "database test lines executed:"
